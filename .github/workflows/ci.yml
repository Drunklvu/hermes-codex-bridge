name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unit tests (stdlib only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for the secrets scan job
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests (zero-dependency core)
        run: python -m unittest discover -s tests -p "test_*.py"

  coverage:
    name: Coverage gate (>= 62% branch, must never regress)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install coverage
        run: python -m pip install coverage
      - name: Measure coverage (core only — sidecar needs a2a-sdk, covered by contract tests)
        run: |
          python -m coverage run --source . \
            --omit "tests/*,monitor_ui.html,a2a_sidecar.py,http_task_service.py,a2a_sdk_contract_check.py" \
            -m unittest discover -s tests -p "test_*.py"
          python -m coverage report \
            --omit "tests/*,monitor_ui.html,a2a_sidecar.py,http_task_service.py,a2a_sdk_contract_check.py" \
            --fail-under=62

  secrets-scan:
    name: Secrets & path scan (release safety net)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan git history too
      - name: Scan tracked files + git history for secrets / local paths / business words
        run: |
          set -e
          FAIL=0
          # Patterns: API keys, GH tokens, Feishu app IDs, phone numbers, local paths, business terms
          grep -rnE 'sk-[A-Za-z0-9]{8,}|ghp_[A-Za-z0-9]{30,}|cli_[a-z0-9]{10,}|1[3-9][0-9]{9}' \
            --include='*.py' --include='*.md' --include='*.ps1' --include='*.sh' --include='*.toml' \
            --include='*.json' --include='*.html' . | grep -vE 'test_|mock_|example|Path.To|Path\\\\To|task-nonexistent' || true
          grep -rnE 'D:\\\\Desktop|C:\\\\Users|pet-monitor|宠物|小红书|a little pet' \
            --include='*.py' --include='*.md' --include='*.ps1' --include='*.sh' --include='*.toml' \
            --include='*.json' --include='*.html' . | grep -vE 'test_|mock_|example|Path.To|Path\\\\To' || true
          echo "--- scanning git history ---"
          git log --all -p | grep -cE 'sk-[A-Za-z0-9]{8,}|ghp_[A-Za-z0-9]{30,}|D:\\\\Desktop|C:\\\\Users|pet-monitor' || echo "0 (clean)"
